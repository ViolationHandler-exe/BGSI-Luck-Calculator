  // render eggs
  const container = document.getElementById("egg-container");

  function renderEggs(world) {
    container.innerHTML = "";
    const eggs = eggData[world];
    eggs.forEach((egg) => {
      const card = document.createElement("div");
      card.className = "egg-card";
      card.innerHTML = `
        <div class="egg-title">${egg.name}</div>
        <div class="options">
          <button class="tab-btn active" data-type="base">Base</button>
          <button class="tab-btn" data-type="shiny">Shiny</button>
          <button class="tab-btn" data-type="mythic">Mythic</button>
          <button class="tab-btn" data-type="shiny-mythic">Shiny Mythic</button>
        </div>
		
		<div class="global-options">
			<div class="tab-btn">
				<label class="luck-event-label">
				  <input type="checkbox" id="luckEventCheckbox" class="luck-event"> Luck Event </label>
			</div>
		</div>
		
        <div class="inputs">
          <label>Luck Bonus (%): <input type="number" class="luck-input" value="100" min="0" id="inputShrink"></label>
          <label>Secret Luck Multi: <input type="number" class="secret-input" value="1" min="0" id="inputShrink"></label>
          <label>Shiny Luck Multi: <input type="number" class="shiny-input" value="40" min="0" id="inputShrink"></label>
          <label>Mythic Luck Multi: <input type="number" class="mythic-input" value="100" min="0" id="inputShrink"></label>
        </div>

        <table>
          <thead>
            <tr><th>Pet</th><th>Base Odds</th><th>Adjusted (1 in X)</th><th>Adjusted (%)</th></tr>
          </thead>
          <tbody>
            ${egg.pets.map(p=>`
              <tr>
                <td>${p.name}</td>
                <td class="adj-b">1 in ${p.odds}</td>
                <td class="adj-x">1 in ${p.odds}</td>
                <td class="adj-p">${(1/p.odds*100).toFixed(6)}%</td>
              </tr>`).join("")}
          </tbody>
        </table>
      `;
      container.appendChild(card);

      const luckInput = card.querySelector(".luck-input");
      const secretInput = card.querySelector(".secret-input");
      const shinyInput = card.querySelector(".shiny-input");
      const mythicInput = card.querySelector(".mythic-input");
      const luckEvent = card.querySelector(".luck-event");
      const tabBtns = card.querySelectorAll(".tab-btn");

      shinyInput.parentElement.style.display = "none";
      mythicInput.parentElement.style.display = "none";
	  

      function recalc(tabType="base") {
        var luck = parseFloat(luckInput.value)||100;
		const isLuckEvent = luckEvent.checked;
        
		if(luck > 200) luck -= 200;
		if(isLuckEvent && luck > 200) luck -= 200;
		
        var secretLuck = parseFloat(secretInput.value)||1;
        // if(secretLuck > 0) secretLuck -= 1;
        const shinyLuck = parseFloat(shinyInput.value)||40;
        const mythicLuck = parseFloat(mythicInput.value)||100;
        
        const rows = card.querySelectorAll("tbody tr");

        egg.pets.forEach((pet,i)=>{
          let odds = pet.odds;
          let bonus = luck/100;
          if(tabType.includes("shiny")) bonus /= shinyLuck;
          if(tabType.includes("mythic")) bonus /= mythicLuck;
          // const adj = (odds / bonus) * shinyLuck * mythicLuck;
          let adj = odds / bonus;
          if(pet.secret) adj /= secretLuck;
          var perc = (1/adj*100);
          if(tabType.includes("mythic") && !pet.legendary && !pet.secret)
          {
            rows[i].querySelector(".adj-b").innerText = "1 in " + odds.toLocaleString();;
            rows[i].querySelector(".adj-x").innerText = "N/A";
            rows[i].querySelector(".adj-p").innerText = "N/A";
          }
          else
          {
            rows[i].querySelector(".adj-b").innerText = "1 in " + odds.toLocaleString();
            rows[i].querySelector(".adj-x").innerText = adj < 999 ? "1 in " + adj.toFixed(1) : "1 in " + Math.round(adj).toLocaleString();
            rows[i].querySelector(".adj-p").innerText = perc.toFixed(6) + "%";
          }
        });
      }

      function updateInputVisibility(tabType){
        shinyInput.parentElement.style.display = tabType.includes("shiny")?"block":"none";
        mythicInput.parentElement.style.display = tabType.includes("mythic")?"block":"none";
      }

      [luckInput,secretInput,shinyInput,mythicInput].forEach(inp=>{
        inp.addEventListener("input",()=>recalc(card.querySelector(".tab-btn.active").dataset.type));
      });

      tabBtns.forEach(btn=>{
        btn.addEventListener("click",()=>{
          tabBtns.forEach(b=>b.classList.remove("active"));
          btn.classList.add("active");
          const tabType = btn.dataset.type;
          recalc(tabType);
          updateInputVisibility(tabType);
        });
      });

      recalc("base");
      updateInputVisibility("base");
    });
  }
  
  

  // Initial render
  renderEggs("Overworld");

  // World buttons
  const worldBtns = document.querySelectorAll(".world-btn");
  worldBtns.forEach(btn=>{
    btn.addEventListener("click",()=>{

      btn.classList.add("active");
      renderEggs(btn.dataset.world);
    });
  });
