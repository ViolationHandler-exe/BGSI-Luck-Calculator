						<label>Mythic Luck Multi: 
							<input type="number" class="mythic-input value-input" value="${globalMythic}" min="0" id="inputShrink">
					</label>
				</div>
				
				<div class="luck-multiplier">
					<label><input type="checkbox" class="luck-multiplier-checkbox" value="500">5x</label>
					<label><input type="checkbox" class="luck-multiplier-checkbox" value="1000">10x</label>
					<label><input type="checkbox" class="luck-multiplier-checkbox" value="2500">25x</label>
				</div>
			</div>
	
			<table>
				<thead>
					<tr><th>Pet</th><th>Base Odds</th><th>Adjusted (1 in X)</th><th>Adjusted (%)</th></tr>
				</thead>
			<tbody>
				${pets.map(p => `
					<tr>
					<td class="adj-n">${p.name}</td>
					<td class="adj-b">${p.odds ? "1 in " + p.odds : "-"}</td>
					<td class="adj-x">-</td>
					<td class="adj-p">-</td>
					</tr>
				`).join("")}
				</tbody>
			</table>
		`;

		container.appendChild(card);

		// query inputs and controls for this card
		const luckInput   = card.querySelector(".luck-input");
		const secretInput = card.querySelector(".secret-input");
		const shinyInput  = card.querySelector(".shiny-input");
		const mythicInput = card.querySelector(".mythic-input");
		const tabBtns     = Array.from(card.querySelectorAll(".tab-btn"));
		const rows        = Array.from(card.querySelectorAll("tbody tr"));
		
		const multiplierCheckboxes = Array.from(card.querySelectorAll(".luck-multiplier-checkbox"));
		
		// hide shiny/mythic multiplier inputs initially
		shinyInput.parentElement.style.display = "none";
		mythicInput.parentElement.style.display = "none";

		// ensure only one checkbox is selected at a time
		multiplierCheckboxes.forEach(cb => {
		  cb.addEventListener("change", () => {
			if (cb.checked) {
			  multiplierCheckboxes.forEach(other => {
				if (other !== cb) other.checked = false;
			  });
			}
			rerenderAll();
		  });
		});

		// per-card recalc function
		function recalc(tabType = "base") {
		  let luck = parseFloat(luckInput.value) || 100;
		  let secretLuck = parseFloat(secretInput.value) || 1;
		  let shinyLuck = parseFloat(shinyInput.value) || 40;
		  let mythicLuck = parseFloat(mythicInput.value) || 100;

		  globalLuck = luck;
		  globalSecret = secretLuck;
		  globalShiny = shinyLuck;
		  globalMythic = mythicLuck;
		  
		  let multiplierBonus = 0;
		  const selectedMultiplier = multiplierCheckboxes.find(cb => cb.checked);
		  if (selectedMultiplier) {
		    multiplierBonus = parseFloat(selectedMultiplier.value);
		  }
		  luck += multiplierBonus;

		  if (luck > 200) luck -= 200;
		  if (world === "Overworld" || world === "SevenSeas") luck += 300;
		  
		  

		  let secretChanceTotal = 0;
		  let anySecretRow = -1;

		  pets.forEach((pet, i) => {
			const row = rows[i];
			if (!row) return;
			if (pet.name == "Any Secret") { anySecretRow = i; return; }

			let odds = pet.odds;
			
			let bonus = luck / 100;
			if (tabType.includes("shiny")) bonus /= shinyLuck;
			if (tabType.includes("mythic")) bonus /= mythicLuck;

			let adj = odds / bonus;
			if (pet.secret) adj /= secretLuck;

			const perc = (1 / adj * 100);

			if (tabType.includes("mythic") && !pet.legendary && !pet.secret) {
			  row.querySelector(".adj-b").innerText = "1 in " + odds.toLocaleString();
			  row.querySelector(".adj-x").innerText = "N/A";
			  row.querySelector(".adj-p").innerText = "N/A";
			} else {
			  row.querySelector(".adj-b").innerText = "1 in " + odds.toLocaleString();
			  row.querySelector(".adj-x").innerText = adj < 999 ? "1 in " + adj.toFixed(1) : "1 in " + Math.round(adj).toLocaleString();
			  row.querySelector(".adj-p").innerText = perc.toFixed(6) + "%";
			}

			if (pet.secret) secretChanceTotal += perc;
		  });

		  if (anySecretRow !== -1) {
			const anyRow = rows[anySecretRow];
			const luckValue = (luck / 100) / (tabType.includes("shiny") ? shinyLuck : 1) / (tabType.includes("mythic") ? mythicLuck : 1);
			if (secretChanceTotal <= 0) {
			  anyRow.querySelector(".adj-b").innerText = "-";
			  anyRow.querySelector(".adj-x").innerText = "N/A";
			  anyRow.querySelector(".adj-p").innerText = "0.000000%";
			} else {
			  const anyOddsRaw = 1 / (secretChanceTotal / 100);
			  const anyOddsBase = anyOddsRaw * luckValue * secretLuck;
			  anyRow.querySelector(".adj-b").innerText = "1 in " + Math.round(anyOddsBase).toLocaleString();
			  anyRow.querySelector(".adj-x").innerText = anyOddsRaw < 999 ? "1 in " + anyOddsRaw.toFixed(1) : "1 in " + Math.round(anyOddsRaw).toLocaleString();
			  anyRow.querySelector(".adj-p").innerText = secretChanceTotal.toFixed(6) + "%";
			}
		  }
		}

		card.recalc = recalc;

		function updateInputVisibility(tabType) {
		  shinyInput.parentElement.style.display = tabType.includes("shiny") ? "block" : "none";
		  mythicInput.parentElement.style.display = tabType.includes("mythic") ? "block" : "none";
		}

		tabBtns.forEach(btn => {
		  btn.addEventListener("click", () => {
			tabBtns.forEach(b => b.classList.remove("active"));
			btn.classList.add("active");
			const tabType = btn.dataset.type;
			updateInputVisibility(tabType);
			card.recalc(tabType);
		  });
		});

		// per-card input listeners
		function onLocalInputChange(kind, rawVal) {
		  let val;
		  if (kind === "secret") {
			val = parseFloat(rawVal);
			if (isNaN(val)) val = 0;
			globalSecret = val;
		  } else {
			val = parseInt(rawVal) || 0;
			if (kind === "luck") globalLuck = val;
			if (kind === "shiny") globalShiny = val;
			if (kind === "mythic") globalMythic = val;
		  }

		  syncInputs();
		  rerenderAll();
		}

		luckInput.addEventListener("input", e => onLocalInputChange("luck", e.target.value));
		secretInput.addEventListener("input", e => onLocalInputChange("secret", e.target.value));
		shinyInput.addEventListener("input", e => onLocalInputChange("shiny", e.target.value));
		mythicInput.addEventListener("input", e => onLocalInputChange("mythic", e.target.value));

		recalc("base");
		updateInputVisibility("base");
	  });
	}

	// sync helper
	function syncInputs() {
	  document.querySelectorAll(".luck-input").forEach(el => { if (document.activeElement !== el) el.value = globalLuck; });
	  document.querySelectorAll(".secret-input").forEach(el => { if (document.activeElement !== el) el.value = globalSecret; });
	  document.querySelectorAll(".shiny-input").forEach(el => { if (document.activeElement !== el) el.value = globalShiny; });
	  document.querySelectorAll(".mythic-input").forEach(el => { if (document.activeElement !== el) el.value = globalMythic; });
	}

	// recalc all cards
	function rerenderAll() {
	  document.querySelectorAll(".egg-card").forEach(card => {
		const activeBtn = card.querySelector(".tab-btn.active");
		const tabType = activeBtn ? activeBtn.dataset.type : "base";
		if (typeof card.recalc === "function") card.recalc(tabType);
	  });
	}

	// initial render
	renderEggs("Overworld");

	// world buttons
	const worldBtns = document.querySelectorAll(".world-btn");
	worldBtns.forEach(btn => {
	  btn.addEventListener("click", () => {
		worldBtns.forEach(b => b.classList.remove("active"));
		btn.classList.add("active");
		renderEggs(btn.dataset.world);
		syncInputs();
		rerenderAll();
	  });
	});
</script>
</body>
</html>
